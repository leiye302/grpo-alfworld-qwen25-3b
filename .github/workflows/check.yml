name: CPU reproduction checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5 hydra-core==1.3.2 omegaconf==2.3.0 pandas==2.2.3 pyarrow==19.0.1
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python src/setup.py --framework
      - run: python src/setup.py --verify
      - run: python scripts/check_release.py
      - run: python -m pytest tests -q
      - run: bash -n scripts/train.sh scripts/eval.sh scripts/run_both.sh
      - run: python src/run.py train --size 1.5b --dry-run > /tmp/grpo-15b-config.yaml
      - run: python src/run.py train --size 3b --dry-run > /tmp/grpo-3b-config.yaml
      - run: bash scripts/train.sh --dry-run > /tmp/grpo-single-model-config.yaml
      - run: bash scripts/eval.sh --model ./unused-hf-model --dry-run > /tmp/grpo-single-model-eval.yaml
